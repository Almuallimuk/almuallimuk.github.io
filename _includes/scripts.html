<script>
(function(){
  "use strict";

  /* ============================================================
     1. RUNTIME CSS FIX
     ============================================================ */
  var cssFix = document.createElement('style');
  cssFix.textContent = `
    .about-list{list-style:none;display:grid;grid-template-columns:1fr;gap:14px;margin-top:22px;padding:0}
    @media(min-width:640px){.about-list{grid-template-columns:1fr 1fr}}
    .about-list li{background:#fff;border:1px solid var(--hairline,rgba(199,161,92,.35));padding:20px;border-radius:8px;font-size:.9rem;color:var(--ink-soft,#4A564E);line-height:1.6}
    .about-list li strong{display:block;font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--green-deep,#0A2A1F);font-weight:600;margin-bottom:6px;line-height:1.25}

    .course-row{display:grid;grid-template-columns:48px 1fr auto;gap:20px;align-items:start;padding:24px 0;border-top:1px solid var(--hairline,rgba(199,161,92,.35))}
    .course-row:last-child{border-bottom:1px solid var(--hairline,rgba(199,161,92,.35))}
    .course-num{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:#C7A15C;line-height:1;padding-top:4px}
    .course-row h3{font-size:1.2rem;margin-bottom:6px}
    .course-meta{font-size:.78rem;color:#4A564E;text-align:right;white-space:nowrap;padding-top:6px}
    @media(max-width:640px){
      .course-row{grid-template-columns:36px 1fr;gap:12px}
      .course-meta{grid-column:1/-1;text-align:left;padding-top:8px}
    }

    .stat-strip{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:1.75rem}
    @media(min-width:700px){.stat-strip{grid-template-columns:repeat(4,1fr)}}
    .stat-card{background:#fff;border:1px solid var(--hairline,rgba(199,161,92,.35));border-radius:8px;padding:22px 18px;text-align:center}
    .stat-card strong{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;color:#0A2A1F;line-height:1.1;font-weight:600;margin-bottom:8px}
    .stat-card span{display:block;font-size:.8rem;color:#4A564E;line-height:1.4}

    .areas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
    @media(min-width:640px){.areas-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
    @media(min-width:900px){.areas-grid{grid-template-columns:repeat(4,1fr)}}
    .area-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--hairline,rgba(199,161,92,.35));border-radius:999px;padding:10px 16px;font-size:.88rem;color:#0A2A1F;font-weight:500;text-decoration:none}
    .area-chip svg{width:14px !important;height:14px !important;flex:none !important}

    .breadcrumb{font-size:.83rem;color:#4A564E;padding:20px 0 0}
    .breadcrumb ol{list-style:none !important;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0;margin:0}
    .breadcrumb li{display:flex;align-items:center;gap:6px}
    .breadcrumb a{color:#C7A15C;font-weight:500;text-decoration:none}

    .course-hero{position:relative;padding:32px 0 52px;overflow:hidden}
    .course-hero h1{margin-bottom:16px}
    .course-hero .lede{color:#4A564E;font-size:1.05rem;max-width:60ch;margin-bottom:26px}
    .course-facts{display:flex;gap:24px;flex-wrap:wrap;margin-top:30px;border-top:1px solid var(--hairline,rgba(199,161,92,.35));padding-top:22px}
    .course-facts div{font-size:.8rem;color:#4A564E}
    .course-facts strong{display:block;font-family:'Cormorant Garamond',serif;font-size:1.45rem;color:#0A2A1F;font-weight:600;line-height:1.15;margin-bottom:4px}

    .testi-strip{display:grid;grid-template-columns:1fr;gap:18px;margin-top:32px}
    @media(min-width:640px){.testi-strip{grid-template-columns:1fr 1fr}}
    @media(min-width:900px){.testi-strip{grid-template-columns:repeat(4,1fr)}}
    .testi{background:rgba(255,255,255,.06);border:1px solid rgba(199,161,92,.35);border-radius:8px;padding:22px}
    .testi p{color:#FBF7EC;font-size:.92rem;font-style:italic;margin-bottom:12px;line-height:1.65}
    .testi span{font-size:.78rem;color:#DDB86B;font-weight:600}

    .nav-cta ~ .nav-cta{display:none !important}

    /* Kill hero-centered CSS so JS can take over */
    .hero-centered .wrap{max-width:none !important;text-align:left !important}
    .hero-centered .hero-ctas,.hero-centered .trust-row{justify-content:flex-start !important}
  `;
  document.head.appendChild(cssFix);

  /* ============================================================
     2. FIX #contact links
     ============================================================ */
  document.querySelectorAll('a[href="#contact"]').forEach(function(a){
    a.setAttribute('href', '/#contact');
  });

  /* ============================================================
     3. HIDE DUPLICATE NAV-CTA
     ============================================================ */
  var navCtas = document.querySelectorAll('.nav-cta');
  for (var i = 1; i < navCtas.length; i++) {
    navCtas[i].style.display = 'none';
  }

  /* ============================================================
     4. SAME HERO LAYOUT on every page
     ============================================================ */

  function makeSVG(){
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'hero-visual');
    svg.setAttribute('viewBox', '0 0 300 320');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', "An open Qur'an resting on a wooden rehal stand");
    svg.innerHTML =
      '<defs><linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFDF6"/><stop offset="100%" stop-color="#F1EBDA"/></linearGradient></defs>' +
      '<circle cx="150" cy="175" r="128" fill="none" stroke="#C7A15C" stroke-opacity="0.18"/>' +
      '<circle cx="150" cy="175" r="148" fill="none" stroke="#C7A15C" stroke-opacity="0.1"/>' +
      '<g stroke="#C7A15C" stroke-width="1.4" fill="none" opacity="0.9"><path d="M150 52 C 162 58 168 70 166 82 C 165 92 158 100 148 103 C 156 96 160 87 159 78 C 158 66 154 58 150 52 Z"/><circle cx="150" cy="45" r="3" fill="#C7A15C" stroke="none"/></g>' +
      '<g stroke="#8A5A2B" stroke-width="7" stroke-linecap="round"><line x1="64" y1="278" x2="222" y2="160"/><line x1="236" y1="278" x2="78" y2="160"/></g>' +
      '<line x1="90" y1="224" x2="210" y2="224" stroke="#8A5A2B" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M150 132 C 106 128 70 141 55 170 C 53 186 53 200 57 212 C 78 191 113 177 150 173 Z" fill="url(#pageGrad)" stroke="#123F2D" stroke-width="2.5"/>' +
      '<path d="M150 132 C 194 128 230 141 245 170 C 247 186 247 200 243 212 C 222 191 187 177 150 173 Z" fill="url(#pageGrad)" stroke="#123F2D" stroke-width="2.5"/>' +
      '<line x1="150" y1="130" x2="150" y2="174" stroke="#0A2A1F" stroke-width="3"/>' +
      '<g stroke="#C7A15C" stroke-width="1.6" opacity="0.8"><line x1="72" y1="168" x2="132" y2="156"/><line x1="69" y1="181" x2="134" y2="167"/><line x1="67" y1="194" x2="136" y2="178"/></g>' +
      '<g stroke="#C7A15C" stroke-width="1.6" opacity="0.8"><line x1="228" y1="168" x2="168" y2="156"/><line x1="231" y1="181" x2="166" y2="167"/><line x1="233" y1="194" x2="164" y2="178"/></g>';
    return svg;
  }

  function setupHero(section){
    if (!section) return;
    var wrap = section.querySelector('.wrap') || section;

    // -------- 1. Content wrapper identify / create --------
    // Agar .wrap khud .fade-in hai (broken case), use alag karo
    if (wrap.classList.contains('fade-in')) {
      wrap.classList.remove('fade-in');
    }

    var content = null;
    // Sirf direct children mein dhundo
    for (var i = 0; i < wrap.children.length; i++) {
      if (wrap.children[i].classList && wrap.children[i].classList.contains('fade-in')) {
        content = wrap.children[i];
        break;
      }
    }

    // Agar nahi mila — naya wrapper banao aur sab kuch us mein daalo
    if (!content) {
      content = document.createElement('div');
      content.className = 'fade-in';
      var kids = [];
      for (var j = 0; j < wrap.children.length; j++) {
        if (!wrap.children[j].classList.contains('hero-visual')) {
          kids.push(wrap.children[j]);
        }
      }
      kids.forEach(function(c){ content.appendChild(c); });
      wrap.appendChild(content);
    }

    // -------- 2. Force grid on wrap --------
    wrap.style.setProperty('display', 'grid', 'important');
    wrap.style.setProperty('direction', 'ltr', 'important');
    wrap.style.setProperty('align-items', 'center', 'important');
    wrap.style.setProperty('text-align', 'left', 'important');
    wrap.style.setProperty('max-width', '1120px', 'important');
    wrap.style.setProperty('margin-left', 'auto', 'important');
    wrap.style.setProperty('margin-right', 'auto', 'important');

    if (window.innerWidth >= 860) {
      wrap.style.setProperty('grid-template-columns', '1.15fr .85fr', 'important');
      wrap.style.setProperty('gap', '60px', 'important');
    } else {
      wrap.style.setProperty('grid-template-columns', '1fr', 'important');
      wrap.style.setProperty('gap', '40px', 'important');
    }

    // -------- 3. Force content left-aligned --------
    content.style.setProperty('text-align', 'left', 'important');
    content.style.setProperty('direction', 'ltr', 'important');
    content.style.setProperty('grid-column', '1', 'important');
    content.style.setProperty('max-width', 'none', 'important');
    content.style.setProperty('margin-left', '0', 'important');
    content.style.setProperty('margin-right', '0', 'important');

    // Har text element pe left-align force karo
    var textEls = content.querySelectorAll('h1, h2, h3, h4, h5, h6, p, .lede, .eyebrow-ar, .hero-ctas, .trust-row, .course-facts, .quick-answer, .author-line');
    textEls.forEach(function(el){
      var isArabic = el.classList.contains('arabic') || el.getAttribute('dir') === 'rtl' || el.classList.contains('eyebrow-ar');
      if (isArabic) {
        el.style.setProperty('margin-left', '0', 'important');
        el.style.setProperty('margin-right', 'auto', 'important');
      } else {
        el.style.setProperty('text-align', 'left', 'important');
        el.style.setProperty('margin-left', '0', 'important');
        el.style.setProperty('margin-right', '0', 'important');
      }
      if (el.classList.contains('hero-ctas') || el.classList.contains('trust-row') || el.classList.contains('course-facts')) {
        el.style.setProperty('justify-content', 'flex-start', 'important');
      }
    });

    // -------- 4. SVG add karo --------
    var svg = wrap.querySelector('.hero-visual');
    if (!svg) {
      svg = makeSVG();
      wrap.appendChild(svg);
    }

    svg.style.setProperty('width', '100%', 'important');
    svg.style.setProperty('display', 'block', 'important');
    svg.style.setProperty('grid-column', '2', 'important');

    if (window.innerWidth >= 860) {
      svg.style.setProperty('max-width', '340px', 'important');
      svg.style.setProperty('margin', '0', 'important');
      svg.style.setProperty('justify-self', 'end', 'important');
      svg.style.setProperty('order', '0', 'important');
    } else {
      svg.style.setProperty('max-width', '220px', 'important');
      svg.style.setProperty('margin', '8px auto 0', 'important');
      svg.style.setProperty('justify-self', 'center', 'important');
      svg.style.setProperty('grid-column', '1', 'important');
      svg.style.setProperty('order', '2', 'important');
    }
  }

  // -------- 5. Targets dhoondo --------
  var heroSelectors = '.hero, .course-hero, .hero-centered, .page-hero, .post-hero, .blog-hero, .blog-post-hero';
  var heroes = document.querySelectorAll(heroSelectors);

  if (heroes.length === 0) {
    var firstH1 = document.querySelector('main h1, h1');
    if (firstH1) {
      var sec = firstH1.closest('section');
      if (sec) {
        sec.classList.add('hero');
        heroes = [sec];
      }
    }
  }

  heroes.forEach(setupHero);

  /* ============================================================
     5. FOOTER YEAR
     ============================================================ */
  var yearEl = document.getElementById('year');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  /* ============================================================
     6. HAMBURGER
     ============================================================ */
  var hamburger = document.getElementById('hamburger');
  var navlinks  = document.getElementById('navlinks');

  function closeMenu(){
    if (navlinks) navlinks.classList.remove('open');
    if (hamburger){
      hamburger.setAttribute('aria-expanded','false');
      hamburger.setAttribute('aria-label','Open menu');
    }
  }

  if (hamburger && navlinks){
    hamburger.addEventListener('click', function(e){
      e.preventDefault();e.stopPropagation();
      var isOpen = navlinks.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      hamburger.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    });
    document.addEventListener('click', function(e){
      if (!navlinks.classList.contains('open')) return;
      if (navlinks.contains(e.target) || hamburger.contains(e.target)) return;
      closeMenu();
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && navlinks.classList.contains('open')){closeMenu();hamburger.focus();}
    });
  }

  /* ============================================================
     7. SMOOTH SCROLL
     ============================================================ */
  function headerOffset(){var h = document.querySelector('header');return h ? h.offsetHeight : 72;}
  function scrollToId(id){
    var target = document.getElementById(id);
    if (!target) return;
    var y = target.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0) - headerOffset() - 8;
    if (y < 0) y = 0;
    try { window.scrollTo({ top: y, behavior: 'smooth' }); } catch (err) { window.scrollTo(0, y); }
  }
  document.addEventListener('click', function(e){
    var el = e.target;if (!el || !el.closest) return;
    var link = el.closest('a[href^="#"]');if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href === '#' || href.length < 2) return;
    var id = href.slice(1);
    if (!document.getElementById(id)) return;
    e.preventDefault();closeMenu();scrollToId(id);
    try { history.replaceState(null, '', href); } catch(err){}
  }, false);

  /* ============================================================
     8. FORM SUBMIT
     ============================================================ */
  var form = document.getElementById('trialForm');
  if (form){
    var consent = form.querySelector('#consent'),consentField = consent ? consent.closest('.consent-field') : null,consentError = form.querySelector('#consent-error');
    var success = document.getElementById('form-success'),submitBtn = form.querySelector('button[type="submit"]'),ajaxFailed = false;
    function showConsentError(msg){
      if (consentError){consentError.textContent = msg;consentError.hidden = false;}
      if (consentField){consentField.classList.remove('invalid');void consentField.offsetWidth;consentField.classList.add('invalid');}
      if (consent) consent.focus();
    }
    function clearConsentError(){
      if (consentError) consentError.hidden = true;
      if (consentField) consentField.classList.remove('invalid');
    }
    if (consent){consent.addEventListener('change', function(){if (consent.checked) clearConsentError();});}
    form.addEventListener('submit', function(e){
      if (ajaxFailed) return;
      clearConsentError();
      if (consent && !consent.checked){
        e.preventDefault();e.stopPropagation();
        showConsentError('Please tick the consent box before submitting the form.');
        return false;
      }
      e.preventDefault();
      var originalText = submitBtn ? submitBtn.textContent : '';
      if (submitBtn){submitBtn.disabled = true;submitBtn.textContent = 'Sending…';}
      fetch('https://formsubmit.co/ajax/almuallimacademy0@gmail.com', {
        method: 'POST',headers: { 'Accept': 'application/json' },body: new FormData(form)
      })
      .then(function(r){if (!r.ok) throw new Error('Request failed');return r.json();})
      .then(function(){
        form.hidden = true;
        if (success){success.hidden = false;try { success.scrollIntoView({ behavior:'smooth', block:'center' }); } catch(err){}}
      })
      .catch(function(){
        ajaxFailed = true;
        if (submitBtn){submitBtn.disabled = false;submitBtn.textContent = originalText || 'Request Free Trial';}
        form.submit();
      });
    }, true);
  }
})();

/* ===== Go to top ===== */
(function(){
  var goTop = document.querySelector('.go-top-btn');
  if (!goTop) return;
  var toggleGoTop = function(){
    if (window.pageYOffset > 500) goTop.classList.add('is-visible');
    else goTop.classList.remove('is-visible');
  };
  window.addEventListener('scroll', toggleGoTop, {passive:true});
  toggleGoTop();
  goTop.addEventListener('click', function(){
    try { window.scrollTo({top:0, behavior:'smooth'}); }
    catch(err){ window.scrollTo(0,0); }
  });
})();

/* ===== Back button ===== */
(function(){
  var backBtn = document.querySelector('.nav-back-btn');
  if (!backBtn) return;
  if (window.history.length <= 1) backBtn.style.display = 'none';
  backBtn.addEventListener('click', function(){
    if (window.history.length > 1) window.history.back();
    else window.location.href = '/';
  });
})();
</script>
