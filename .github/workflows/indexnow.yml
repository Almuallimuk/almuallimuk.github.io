name: IndexNow — Bing URL Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract URLs from sitemap
        id: urls
        run: |
          URLS=$(grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed 's/<[^>]*>//g' | tr '\n' ',')
          URLS=$(echo "$URLS" | sed 's/,$//')
          echo "urls=$URLS" >> $GITHUB_OUTPUT
          echo "URLs found:"
          echo "$URLS" | tr ',' '\n'
          echo "Total:"
          echo "$URLS" | tr ',' '\n' | wc -l

      - name: Submit to IndexNow
        run: |
          URLS="${{ steps.urls.outputs.urls }}"
          JSON_URLS=$(echo "$URLS" | tr ',' '\n' | sed 's/.*/"&"/' | tr '\n' ',' | sed 's/,$//')
          
          echo "Submitting to IndexNow..."
          curl -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"almuallim.uk\",
              \"key\": \"5bf96f9501934c0fbeb15e51a0ad06de\",
              \"keyLocation\": \"https://almuallim.uk/5bf96f9501934c0fbeb15e51a0ad06de.txt\",
              \"urlList\": [$JSON_URLS]
            }" -w "\n\nHTTP Status: %{http_code}\n"
